<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recycler Facility | EcoChain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar-custom">
    <a href="index.html" class="brand-title">
      <span class="brand-dot"></span>
      EcoChain Protocol
    </a>
    <div class="nav-links">
      <a href="user.html" class="nav-link-btn">User Portal</a>
      <a href="collection.html" class="nav-link-btn">Collection Hub</a>
      <a href="recycler.html" class="nav-link-btn active">Recycler Facility</a>
      <a href="admin.html" class="nav-link-btn">Ledger Explorer</a>
    </div>
  </nav>

  <div class="bento-container" style="max-width: 650px;">
    <div class="bento-card">
      <span class="form-label-custom">Material Reclamation</span>
      <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem;">Recycling Facility Certification</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Acknowledge warehouse receipt and certify material recovery on the blockchain.</p>

      <div style="margin-bottom: 1.25rem;">
        <label class="form-label-custom">Target E-Waste ID</label>
        <input type="text" id="targetId" class="form-control-custom" placeholder="e.g. EW-1793029669">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
        <button class="btn-bento-action btn-action-blue" onclick="updateStatus('RECEIVED')">Acknowledge RECEIVED</button>
        <button class="btn-bento-action btn-action-green" onclick="updateStatus('RECYCLED')">Certify RECYCLED ✓</button>
      </div>

      <div id="statusRes" style="display: none; padding: 1rem; border-radius: 10px; font-size: 0.85rem; margin-top: 1rem;"></div>
    </div>
  </div>

  <script>
    async function updateStatus(newStatus) {
      const id = document.getElementById('targetId').value.trim();
      if(!id) return alert("Please specify an E-Waste ID");

      const resDiv = document.getElementById('statusRes');
      resDiv.style.display = "block";
      resDiv.style.background = "rgba(255,255,255,0.05)";
      resDiv.style.color = "var(--text-main)";
      resDiv.innerText = `Submitting proof of '${newStatus}' to Ethereum...`;

      try {
        const res = await fetch('http://127.0.0.1:5000/api/ewaste/update', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ ewasteId: id, status: newStatus })
        });
        const data = await res.json();
        if(data.success) {
          resDiv.style.background = "rgba(16, 185, 129, 0.15)";
          resDiv.style.color = "var(--accent-green)";
          resDiv.innerHTML = `<strong>Success:</strong> State updated to <b>${newStatus}</b><br><span style='font-family: var(--font-mono); font-size: 0.72rem;'>Tx: ${data.txHash}</span>`;
        } else {
          resDiv.style.background = "rgba(239, 68, 68, 0.15)";
          resDiv.style.color = "#f87171";
          resDiv.innerText = "Error: " + data.error;
        }
      } catch(e) {
        resDiv.innerText = "Connection failed. Make sure app.py is running.";
      }
    }
  </script>
</body>
</html>
