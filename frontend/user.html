<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Portal | Register E-Waste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 600px;">
        <a href="index.html" class="text-decoration-none text-muted mb-3 d-inline-block">&larr; Back to Home</a>
        <div class="card shadow-sm p-4 border-0">
            <h4 class="fw-bold mb-3">Register E-Waste Item</h4>
            <form id="regForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="ownerName" class="form-control" placeholder="e.g. Vanshika Tiwari" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Device Type</label>
                    <select id="deviceType" class="form-select">
                        <option value="Laptop">Laptop</option>
                        <option value="Mobile Phone">Mobile Phone</option>
                        <option value="Battery">Battery</option>
                        <option value="Keyboard / Mouse">Keyboard / Mouse</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" step="0.1" id="weight" class="form-control" placeholder="e.g. 2.4" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Physical Condition</label>
                    <input type="text" id="condition" class="form-control" placeholder="e.g. Damaged screen, non-functional">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2">Register on Blockchain</button>
            </form>

            <div id="receiptCard" class="mt-4 p-3 bg-light rounded text-center d-none border">
                <h5 class="text-success fw-bold">✓ Blockchain Record Confirmed</h5>
                <p class="mb-1"><strong>ID:</strong> <span id="outId" class="badge bg-dark"></span></p>
                <p class="text-truncate small text-muted"><strong>Tx Hash:</strong> <span id="outHash"></span></p>
                <div class="my-3">
                    <img id="outQr" class="border p-2 bg-white rounded shadow-sm" alt="QR Code">
                </div>
                <a id="trackLink" class="btn btn-outline-primary btn-sm" target="_blank">Open Verification Timeline &rarr;</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "Confirming Transaction on Chain...";

            const payload = {
                ownerName: document.getElementById('ownerName').value,
                deviceType: document.getElementById('deviceType').value,
                weight: document.getElementById('weight').value,
                condition: document.getElementById('condition').value
            };

            try {
                const res = await fetch('http://127.0.0.1:5000/api/ewaste/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('regForm').reset();
                    document.getElementById('receiptCard').classList.remove('d-none');
                    document.getElementById('outId').innerText = data.item.ewasteId;
                    document.getElementById('outHash').innerText = data.item.transactionHashes[0].hash;
                    document.getElementById('outQr').src = data.item.qrCodeDataURL;
                    document.getElementById('trackLink').href = `track.html?id=${data.item.ewasteId}`;
                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                alert("Server Connection Failed. Make sure app.py is running.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Register on Blockchain";
            }
        });
    </script>
</body>
</html>
