<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Portal | EcoChain</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar-custom">
    <a href="index.html" class="brand-title">
      <span class="brand-dot"></span>
      EcoChain Protocol
    </a>
    <div class="nav-links">
      <a href="user.html" class="nav-link-btn active">User Portal</a>
      <a href="collection.html" class="nav-link-btn">Collection Hub</a>
      <a href="recycler.html" class="nav-link-btn">Recycler Facility</a>
      <a href="admin.html" class="nav-link-btn">Ledger Explorer</a>
    </div>
  </nav>

  <div class="bento-container" style="max-width: 900px;">
    <div class="bento-grid">
      <!-- Input Card -->
      <div class="bento-card" style="grid-column: span 7;">
        <h2 style="font-size: 1.35rem; font-weight: 700; margin-bottom: 0.25rem;">Register E-Waste Item</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Creates a permanent genesis record on the Ethereum blockchain.</p>

        <form id="regForm">
          <div style="margin-bottom: 1rem;">
            <label class="form-label-custom">Owner / Entity Name</label>
            <input type="text" id="ownerName" class="form-control-custom" placeholder="e.g. Vanshika Tiwari" required>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
              <label class="form-label-custom">Device Category</label>
              <select id="deviceType" class="form-select-custom">
                <option value="Laptop">Laptop</option>
                <option value="Mobile Phone">Mobile Phone</option>
                <option value="Battery">Battery</option>
                <option value="Printed Circuit Board">PCB / Electronics</option>
              </select>
            </div>
            <div>
              <label class="form-label-custom">Weight (kg)</label>
              <input type="number" step="0.1" id="weight" class="form-control-custom" placeholder="e.g. 2.4" required>
            </div>
          </div>
          <div style="margin-bottom: 1.5rem;">
            <label class="form-label-custom">Physical State & Serial Info</label>
            <input type="text" id="condition" class="form-control-custom" placeholder="e.g. Broken screen, non-booting motherboard">
          </div>
          <button type="submit" id="submitBtn" class="btn-bento-primary">Sign & Broadcast Transaction</button>
        </form>
      </div>

      <!-- Dynamic QR / Confirmation Bento -->
      <div class="bento-card" style="grid-column: span 5; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
        <div id="qrPlaceholder" style="padding: 2rem 0;">
          <div style="width: 70px; height: 70px; border: 2px dashed var(--border-subtle); border-radius: 12px; margin: 0 auto 1rem auto; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">
            QR
          </div>
          <p style="color: var(--text-muted); font-size: 0.85rem;">Submit registration to generate tamper-evident QR verification badge.</p>
        </div>

        <div id="receiptBox" style="display: none; width: 100%;">
          <span class="status-badge registered" style="margin-bottom: 0.75rem;">GENESIS CONFIRMED</span>
          <h4 id="outId" class="mono-tag" style="display: block; font-size: 0.95rem; margin-bottom: 0.5rem;"></h4>
          <div style="background: white; padding: 10px; border-radius: 12px; display: inline-block; margin: 0.75rem 0;">
            <img id="outQr" style="width: 140px; height: 140px; display: block;" alt="QR Code">
          </div>
          <p style="font-size: 0.72rem; color: var(--text-muted); word-break: break-all; margin-bottom: 1rem;" id="outHash"></p>
          <a id="trackLink" class="btn-bento-action btn-action-green" style="display: block; text-decoration: none; font-size: 0.85rem;" target="_blank">Open Audit Timeline &rarr;</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Signing On-Chain...";

      const payload = {
        ownerName: document.getElementById('ownerName').value,
        deviceType: document.getElementById('deviceType').value,
        weight: document.getElementById('weight').value,
        condition: document.getElementById('condition').value
      };

      try {
        const res = await fetch('http://127.0.0.1:5000/api/ewaste/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(data.success) {
          document.getElementById('regForm').reset();
          document.getElementById('qrPlaceholder').style.display = 'none';
          document.getElementById('receiptBox').style.display = 'block';
          document.getElementById('outId').innerText = data.item.ewasteId;
          document.getElementById('outHash').innerText = "Tx: " + data.item.transactionHashes[0].hash;
          document.getElementById('outQr').src = data.item.qrCodeDataURL;
          document.getElementById('trackLink').href = `track.html?id=${data.item.ewasteId}`;
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Server connection failed. Is app.py active?");
      } finally {
        btn.disabled = false;
        btn.innerText = "Sign & Broadcast Transaction";
      }
    });
  </script>
</body>
</html>
