<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold">Ledger Overview & Impact Dashboard</h3>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Home</a>
        </div>

        <div class="row g-3 mb-4 text-center">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm border-0">
                    <small class="text-muted">Total Units Registered</small>
                    <h2 id="totalCount" class="fw-bold text-dark mt-2">-</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm border-0">
                    <small class="text-muted">Total Weight Diverted</small>
                    <h2 id="totalWeight" class="fw-bold text-success mt-2">- kg</h2>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 shadow-sm border-0">
                    <small class="text-muted">Recycling Completed</small>
                    <h2 id="totalRecycled" class="fw-bold text-primary mt-2">-</h2>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 p-3">
            <h5 class="fw-bold mb-3">All Registered Items</h5>
            <div class="table-responsive">
                <table class="table table-hover table-bordered small">
                    <thead class="table-dark">
                        <tr>
                            <th>E-Waste ID</th>
                            <th>Owner</th>
                            <th>Device</th>
                            <th>Weight (kg)</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            const res = await fetch('http://127.0.0.1:5000/api/ewaste/all');
            const data = await res.json();
            if(!data.success) return;

            const items = data.items;
            document.getElementById('totalCount').innerText = items.length;
            
            let weightSum = 0;
            let recycledCount = 0;
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            items.forEach(item => {
                weightSum += Number(item.weight || 0);
                if(item.status === 'RECYCLED') recycledCount++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><code>${item.ewasteId}</code></td>
                    <td>${item.ownerName}</td>
                    <td>${item.deviceType}</td>
                    <td>${item.weight}</td>
                    <td><span class="badge bg-secondary">${item.status}</span></td>
                    <td><a href="track.html?id=${item.ewasteId}" target="_blank" class="btn btn-sm btn-outline-primary">Track</a></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalWeight').innerText = weightSum.toFixed(1) + " kg";
            document.getElementById('totalRecycled').innerText = recycledCount;
        }

        loadAdminData();
    </script>
</body>
</html>
