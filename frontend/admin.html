<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ledger Explorer | EcoChain</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .filter-bar {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      width: 100%;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .filter-input {
      flex: 1;
      min-width: 0;
    }
    .filter-dropdown {
      width: 250px;
      flex-shrink: 0;
    }
    .table-container {
      width: 100%;
      overflow-x: auto;
    }
    .ledger-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.85rem;
    }
    .ledger-table th {
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.85rem 1rem;
      text-align: left;
    }
    .ledger-table td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ledger-table tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }
    .action-cell {
      text-align: right !important;
    }
    .btn-verify {
      display: inline-block;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .btn-verify:hover {
      background: rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>
  <nav class="navbar-custom">
    <a href="index.html" class="brand-title">
      <span class="brand-dot"></span>
      EcoChain Protocol
    </a>
    <div class="nav-links">
      <a href="user.html" class="nav-link-btn">User Intake</a>
      <a href="collection.html" class="nav-link-btn">Collection Hub</a>
      <a href="recycler.html" class="nav-link-btn">Recycler Facility</a>
      <a href="admin.html" class="nav-link-btn active">Ledger Explorer</a>
    </div>
  </nav>

  <div class="bento-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Protocol Ledger Analytics</h1>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Real-time on-chain verifiable audit metrics & custody tracking.</p>
      </div>
      <div>
        <button class="btn-bento-action btn-action-blue" onclick="loadAdminData()" style="padding: 0.6rem 1.1rem; font-size: 0.85rem;">Refresh Ledger ↻</button>
      </div>
    </div>

    <!-- Bento Top Metrics -->
    <div class="bento-grid" style="margin-bottom: 1.5rem;">
      <div class="bento-card" style="grid-column: span 4;">
        <span class="form-label-custom">Total Registered Assets</span>
        <h2 id="totalCount" style="font-size: 2.25rem; font-weight: 800; margin-top: 0.5rem;">-</h2>
      </div>
      <div class="bento-card" style="grid-column: span 4;">
        <span class="form-label-custom">Recovered Weight</span>
        <h2 id="totalWeight" style="font-size: 2.25rem; font-weight: 800; color: var(--accent-green); margin-top: 0.5rem;">- kg</h2>
      </div>
      <div class="bento-card" style="grid-column: span 4;">
        <span class="form-label-custom">Certified Recycled</span>
        <h2 id="totalRecycled" style="font-size: 2.25rem; font-weight: 800; color: var(--accent-blue); margin-top: 0.5rem;">-</h2>
      </div>
    </div>

    <!-- Registry & Search Bento -->
    <div class="bento-card">
      <div class="filter-bar">
        <div class="filter-input">
          <input type="text" id="filterQuery" class="form-control-custom" placeholder="Search by ID, owner, or device category..." oninput="loadAdminData()">
        </div>
        <div class="filter-dropdown">
          <select id="filterStatus" class="form-select-custom" onchange="loadAdminData()">
            <option value="ALL" selected>All Statuses</option>
            <option value="REGISTERED">Registered</option>
            <option value="COLLECTED">Collected</option>
            <option value="IN TRANSIT">In Transit</option>
            <option value="RECEIVED">Received</option>
            <option value="RECYCLED">Recycled</option>
          </select>
        </div>
      </div>

      <div class="table-container">
        <table class="ledger-table">
          <thead>
            <tr>
              <th style="width: 22%;">Asset ID</th>
              <th style="width: 20%;">Owner</th>
              <th style="width: 18%;">Device</th>
              <th style="width: 12%;">Weight</th>
              <th style="width: 16%;">Status</th>
              <th style="width: 12%; text-align: right;">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
<script src="config.js"></script>
  <script>
    let allItemsCache = [];

    async function loadAdminData() {
      const q = document.getElementById('filterQuery').value.trim();
      const statusSelect = document.getElementById('filterStatus');
      const selectedStatus = statusSelect.value;

      try {
        // Fetch all items to keep metrics and dropdown badges accurate
const fullRes = await fetch(`${http://127.0.0.1:5000}/api/ewaste/all`);        const fullData = await fullRes.json();
        
        if (fullData.success) {
          allItemsCache = fullData.items;
          updateFilterBadges(allItemsCache, selectedStatus);

          document.getElementById('totalCount').innerText = allItemsCache.length;
          let weightSum = 0;
          let recycledCount = 0;
          allItemsCache.forEach(item => {
            weightSum += Number(item.weight || 0);
            if (item.status === 'RECYCLED') recycledCount++;
          });
          document.getElementById('totalWeight').innerText = weightSum.toFixed(1) + " kg";
          document.getElementById('totalRecycled').innerText = recycledCount;
        }

        // Now fetch filtered results for the table
const res = await fetch(`${http://127.0.0.1:5000}/api/ewaste/search?q=${encodeURIComponent(q)}&status=${encodeURIComponent(selectedStatus)}`);        const data = await res.json();
        if(!data.success) return;

        const items = data.items;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";

        if(items.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 2rem;">No matching assets found for this filter.</td></tr>`;
          return;
        }

        items.forEach(item => {
          const tr = document.createElement('tr');
          const statusKey = item.status.toLowerCase().replace(/\s+/g, '');

          tr.innerHTML = `
            <td><span class="mono-tag">${item.ewasteId}</span></td>
            <td style="font-weight: 500;">${item.ownerName}</td>
            <td>${item.deviceType}</td>
            <td>${item.weight} kg</td>
            <td><span class="status-badge ${statusKey}">${item.status}</span></td>
            <td class="action-cell">
              <a href="track.html?id=${item.ewasteId}" target="_blank" class="btn-verify">Verify Audit &rarr;</a>
            </td>
          `;
          tbody.appendChild(tr);
        });

      } catch(err) {
        console.error("Ledger fetch error:", err);
      }
    }

    function updateFilterBadges(items, currentVal) {
      const counts = { ALL: items.length, REGISTERED: 0, COLLECTED: 0, "IN TRANSIT": 0, RECEIVED: 0, RECYCLED: 0 };
      items.forEach(i => {
        if (counts[i.status] !== undefined) counts[i.status]++;
      });

      const select = document.getElementById('filterStatus');
      select.innerHTML = `
        <option value="ALL" ${currentVal === 'ALL' ? 'selected' : ''}>All Statuses (${counts.ALL})</option>
        <option value="REGISTERED" ${currentVal === 'REGISTERED' ? 'selected' : ''}>Registered (${counts.REGISTERED})</option>
        <option value="COLLECTED" ${currentVal === 'COLLECTED' ? 'selected' : ''}>Collected (${counts.COLLECTED})</option>
        <option value="IN TRANSIT" ${currentVal === 'IN TRANSIT' ? 'selected' : ''}>In Transit (${counts["IN TRANSIT"]})</option>
        <option value="RECEIVED" ${currentVal === 'RECEIVED' ? 'selected' : ''}>Received (${counts.RECEIVED})</option>
        <option value="RECYCLED" ${currentVal === 'RECYCLED' ? 'selected' : ''}>Recycled (${counts.RECYCLED})</option>
      `;
    }

    // Initial Load
    loadAdminData();
  </script>
</body>
</html>
